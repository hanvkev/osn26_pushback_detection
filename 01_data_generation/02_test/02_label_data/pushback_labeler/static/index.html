<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pushback Segment Labeler</title><link rel="stylesheet" href="/static/app.css"><link rel="stylesheet" href="/static/style.css"></head><body><main class="app">
<header class="header"><h1>Pushback Segment Labeler</h1><span id="message"></span></header>
<section class="panel row"><label class="field grow">Datenpfad<input id="data-path" class="input" placeholder="data/test/01_fetched/<AIRPORT>/<SEASON>/<DATE>.parquet"></label><label class="field grow">Ausgabeordner<input id="output-path" class="input" placeholder="data/test/02_labeled/<AIRPORT>/<SEASON>/<DATE>"></label><button id="load" class="btn btn-primary">Datensatz laden</button><div class="dataset-meta"><label class="field">Airport<input id="meta-airport" placeholder="z. B. KBOS"></label><label class="field">Datum<input id="meta-date" type="date"></label><div class="derived-meta">Saison wird automatisch nach dem Kalender der Nordhalbkugel bestimmt.</div></div><details style="flex-basis:100%"><summary>Spaltennamen (nur bei abweichenden Namen)</summary><div class="row"><label class="field">Flight-ID<input id="col-flight" value="flight_id"></label><label class="field">Timestamp<input id="col-time" value="timestamp"></label><label class="field">Latitude<input id="col-lat" value="latitude"></label><label class="field">Longitude<input id="col-lon" value="longitude"></label><label class="field">Groundspeed<input id="col-gs" value="compute_gs"></label><label class="field">Airport-Spalte (optional)<input id="col-airport" placeholder="nicht vorhanden"></label><label class="field">Saison-Spalte (optional)<input id="col-season" placeholder="nicht vorhanden"></label></div></details></section>
<section class="metrics"><div class="metric"><small>Flüge gesamt</small><b id="m-total">0</b></div><div class="metric"><small>Gelabelt</small><b id="m-labelled">0</b></div><div class="metric"><small>No pushback</small><b id="m-no">0</b></div><div class="metric"><small>Not clear</small><b id="m-unclear">0</b></div><div class="metric"><small>Offen</small><b id="m-open">0</b></div></section><div class="progress"><div id="progress-fill"></div></div>
<section class="panel row"><button id="prev-flight" class="btn">← Vorheriger Flug</button><label class="field grow">Flug<select id="flight" class="input"></select></label><button id="next-flight" class="btn">Nächster Flug →</button></section>
<section class="panel"><div class="row"><label class="field grow">Initialer Kartenzoom<input id="zoom" type="range" min="11" max="22" step=".25" value="16"></label><label class="field">Punkte für Kartenfokus<input id="focus-points" type="number" value="2" min="2"></label><label class="field">Punktgröße<input id="point-size" type="number" value="7" min="2" max="20"></label><label class="field">Kartenhintergrund<select id="map-style"><option value="osm">OpenStreetMap</option><option value="carto-light">CARTO Light</option><option value="carto-dark">CARTO Dark</option><option value="none">Keiner</option></select></label><button id="apply-map-view" class="btn btn-primary">Kartenfokus anwenden</button></div><div class="map-shell"><div id="map"></div><div class="map-pointnav"><button id="minus10" class="btn">−10</button><button id="minus1" class="btn">← Punkt</button><button id="plus1" class="btn">Punkt →</button><button id="plus10" class="btn">+10</button></div></div></section>
<section class="panel"><div class="row plot-controls"><label class="field">Initiales GS-Fokusfenster (Punkte)<input id="plot-focus-points" type="number" value="180" min="2"></label><button id="apply-plot-view" class="btn">GS-Fokus anwenden</button></div><div id="gs"></div></section><div class="pointbar"><button id="set-start" class="btn btn-primary">Als Start</button><button id="set-end" class="btn btn-primary">Als Ende</button><button id="clear-start" class="btn">Start löschen</button><button id="clear-end" class="btn">Ende löschen</button></div><div id="point-info" class="point-info"></div>
<section class="editor-grid"><div class="panel"><h3>Segment hinzufügen</h3><div id="selection-info" class="notice"></div><div class="row"><button id="add-pushback" class="btn btn-segment btn-pushback">Pushback</button><button id="add-push" class="btn btn-segment btn-push">Push</button><button id="add-pull" class="btn btn-segment btn-pull">Pull</button></div><h3>Vorhandene Segmente</h3><div id="segments" class="segment-list"></div></div><div class="panel"><h3>Flugstatus</h3><div id="status-buttons" class="tag-wrap"></div><h3>Tags</h3><div id="tag-buttons" class="tag-wrap"></div><div class="row"><input id="new-tag" class="input" placeholder="Neuer Tag"><button id="add-tag" class="btn">Tag hinzufügen</button></div><label>Notiz<textarea id="note"></textarea></label><div class="savebar"><button id="save" class="btn">Speichern</button><button id="save-next" class="btn btn-primary">Speichern & nächster Flug</button></div></div></section>
<label class="field" style="display:none">Max GS<input id="max-gs" value="20"></label>
</main><script src="/static/app.js"></script></body></html>
