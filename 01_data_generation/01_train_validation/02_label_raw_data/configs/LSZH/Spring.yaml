filters:
  max_distance: 0.5
  max_distance_start: 0.1
  min_duration: 17
  min_average_speed: 0.000170

reasons:
  max_distance: >
    Pushback segments with a distance greater than 0.5 NM were found to be
    incorrectly labeled.

  max_distance_start: >
    Pushback segments starting more than 0.1 NM from the beginning of the
    trajectory were found to be incorrectly labeled, affected by noise, or incomplete.

  min_duration: >
    Pushback segments shorter than 17 seconds were found to be incorrectly
    labeled or to have an incorrectly detected start or end.

  min_average_speed: >
    Pushback segments with an average speed below 0.000170 were mostly found
    to be incorrectly labeled.

  pushbacks_remove: >
    Additional incorrectly labeled pushback segments identified during
    manual inspection.

  pushbacks_keep: >
    Automatically filtered pushback segments that were manually confirmed
    to be correctly labeled.

  no_pushbacks_remove: >
    Flights without an automatically detected pushback that were identified
    as false negatives during manual inspection and therefore excluded.

