airport: LSZH
season: Summer

filters:
  max_distance: 0.25
  max_distance_start: null
  min_duration: 10
  min_average_speed: 0.00015

reasons:
  max_distance: >
    Pushback segments with a distance greater than 0.25 NM were found to be
    incorrectly labeled.

  max_distance_start: >
    No additional filter based on the distance from the beginning of the
    trajectory was required for this airport and season.

  min_duration: >
    Pushback segments shorter than 10 seconds were found to be incorrectly
    labeled or to have an incorrectly detected start or end.

  min_average_speed: >
    Pushback segments with an average speed below 0.00015 were mostly found
    to be incorrectly labeled.

  pushbacks_remove: >
    Additional incorrectly labeled pushback segments identified during
    manual inspection.

  pushbacks_keep: >
    Automatically filtered pushback segments that were manually confirmed
    to be correctly labeled.

  no_pushbacks_remove: >
    Flights without an automatically detected pushback that were identified
    as false negatives during manual inspection and therefore excluded.

