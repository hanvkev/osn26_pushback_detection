reasons:
  min_distance: >
    Pushback segments with a distance below 0.0015 NM were considered most likely
    to be noise.

  max_distance: >
    No additional maximum-distance filter was required for this airport and season.

  max_distance_start: >
    No additional filter based on the distance from the beginning of the
    trajectory was required for this airport and season.

  min_duration: >
    No additional minimum-duration filter was required for this airport and season.

  max_duration: >
    Pushback segments longer than 250 seconds were found to be incorrectly labeled
    or excessively long due to noise, an early detected start, or a late detected end.

  min_average_speed: >
    Pushback segments with an average speed below 0.00015 were mostly found
    to be incorrectly labeled.

  pushbacks_remove: >
    Additional incorrectly labeled pushback segments identified during
    manual inspection.

  pushbacks_keep: >
    Automatically filtered pushback segments that were manually confirmed
    to be correctly labeled.

  no_pushbacks_remove: >
    Flights without an automatically detected pushback that were identified
    as false negatives during manual inspection and therefore excluded.

