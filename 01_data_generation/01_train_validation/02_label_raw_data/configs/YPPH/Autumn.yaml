    trajectory were found to be incorrectly labeled, affected by noise, or incomplete.

  min_duration: >
    Pushback segments shorter than 15 seconds were found to be incorrectly
    labeled or to have an incorrectly detected start or end.

  max_duration: >
    No additional maximum-duration filter was required for this airport and season.

  min_average_speed: >
    Pushback segments with an average speed below 0.00017 were mostly found
    to be incorrectly labeled.

  max_average_speed: >
    No maximum-average-speed filter was applied for this airport and season.

  pushbacks_remove: >
    Additional incorrectly labeled pushback segments identified during
    manual inspection.

  pushbacks_keep: >
    Automatically filtered pushback segments that were manually confirmed
    to be correctly labeled.

  no_pushbacks_remove: >
    Flights without an automatically detected pushback that were identified
    as false negatives during manual inspection and therefore excluded.

  no_pushbacks_remove_prefixes: >
    Flights with IDs starting with NWK, UTY, or VOZ were excluded because
    their reported track values appeared to correspond to computed track,
    causing the pushback labeling algorithm to fail.

