  pushbacks_keep: >
    Automatically filtered pushback segments that were manually confirmed
    to be correctly labeled.

  no_pushbacks_remove: >
    Flights without an automatically detected pushback that were identified
    as false negatives during manual inspection and therefore excluded.

  no_pushbacks_remove_prefixes: >
    Flights with IDs starting with NWK, UTY, or VOZ were excluded because
    their reported track values appeared to correspond to computed track,
    causing the pushback labeling algorithm to fail.

